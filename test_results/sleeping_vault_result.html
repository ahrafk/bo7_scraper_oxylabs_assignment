<h1>The door slides open. 🚪</h1>
<p>Cool breeze. Dim light. You step inside.</p>
<p>Whatever you’re doing — keep it weird, but quiet.</p>
<script>
(function() {
    // Wait for page to be fully loaded before starting fingerprint collection
    function startFingerprinting() {
        var script = document.createElement('script');
        script.async = true;
        script.src = '/resources/thumbmark.js';
        script.onload = function() {
            // Use requestIdleCallback if available, otherwise setTimeout with delay
            var runWhenIdle = window.requestIdleCallback || function(cb) { setTimeout(cb, 500); };
            runWhenIdle(function() {
                setTimeout(function() {
                    if (typeof ThumbmarkJS !== 'undefined' && ThumbmarkJS.getThumbmark) {
                        ThumbmarkJS.getThumbmark({logging: false}).then(function(fingerprintData) {
                            if (fingerprintData && fingerprintData.thumbmark) {
                                // Use fetch with keepalive for non-blocking request
                                fetch('/api/thumbmark', {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'x-mysterious-value': 'OrY3aWdw4dAe6YxOs2BS01T_rI6iw0FFSgMel9s4aoo'
                                    },
                                    body: JSON.stringify({
                                        thumbmark_id: fingerprintData.thumbmark,
                                        fingerprint: fingerprintData.components || {}
                                    }),
                                    keepalive: true
                                }).catch(function() {});
                            }
                        }).catch(function() {});
                    }
                }, 100);
            });
        };
        script.onerror = function() {};
        document.head.appendChild(script);
    }
    
    // Start after page load is complete
    if (document.readyState === 'complete') {
        startFingerprinting();
    } else {
        window.addEventListener('load', startFingerprinting, {once: true});
    }
})();
</script>
